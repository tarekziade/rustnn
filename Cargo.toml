[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = { version = "3.8", features = ["base64"] }
thiserror = "2.0"
base64 = "0.22"
prost = "0.12"
prost-types = "0.12"
bytes = "1.6"
bytemuck = { version = "1.15", features = ["extern_crate_std"] }
ndarray = { version = "0.17", optional = true }
tempfile = "3.27"
libloading = { version = "0.9", optional = true }
ort = { version = "=2.0.0-rc.13", optional = true, features = [
    "ndarray",
    "half",
    "load-dynamic",
    "api-27",
] }
half = "2.4"
safetensors = "0.7"
trtx = { version = "0.8.0", optional = true }
litert = { version = "0.2.1", optional = true }
litert-sys = { version = "0.2.1", optional = true }
flatbuffers = { version = "25.12", optional = true }
regex = "1.11"
hiai-rs = { git = "https://github.com/rustnn/hiai-rs", rev = "6c93e1b", optional = true }
webnn-graph = { git = "https://github.com/rustnn/webnn-graph", branch = "main" }
webnn-onnx-utils = { git = "https://github.com/rustnn/webnn-onnx-utils", branch = "main" }

cudarc = { version = "0.19", features = ["cuda-13020"], optional = true }
log = "0.4.29"
pretty_env_logger = "0.5.0"
seahash = "4.1.0"
dirs = "6.0.0"
zstd = { version = "0.13", optional = true }


web-sys = { version = "0.3.104", features = [
    "console",
    "GpuDevice",
    "Navigator",
    "Window",
], optional = true }
wasm-bindgen = { version = "0.2.127", optional = true }
js-sys = { version = "0.3.104", optional = true }
wasm-bindgen-futures = { version = "0.4.77", optional = true }

# The exception feature is needed to avoid undefined behavior when objc throws exceptions
objc = { version = "0.2", optional = true, features = [] } # without "exception" it builds on Linux using https://github.com/gnustep/libobjc2
block = { version = "0.1", optional = true }
pollster = { version = "1.0.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# For macOS, explicitly enable the "exception" feature
objc = { version = "0.2", optional = true, features = ["exception"] }

[build-dependencies]
prost-build = "0.12"
cc = "1.0"
seahash = "4.1.0"

[dev-dependencies]
half = "2.4"
insta = { version = "1.47.2", features = ["yaml"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
dirs = "6.0.0"
anyhow = "1.0.102"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
libtest-mimic = "0.8.2"
pretty_env_logger = "0.5.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"


[[test]]
name = "run_wpt_conformance"
path = "tests/run_wpt_conformance.rs"
harness = false

[[example]]
name = "fast_style_transfer_builder_api"
path = "examples/fast_style_transfer_builder_api.rs"
required-features = ["native-examples"]

[[example]]
name = "smollm_mlcontext"
path = "examples/smollm_mlcontext.rs"
required-features = ["native-examples"]

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3

[lib]
name = "rustnn"
crate-type = ["rlib"]
doctest = false
