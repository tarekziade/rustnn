[package]
name = "rustnn"
version = "0.5.11"
edition = "2024"
# Keep in sync with the `channel` in rust-toolchain.toml.
rust-version = "1.97"
description = "W3C WebNN implementation with ONNX, CoreML, and TensorRT backends [DO NOT USE IN PRODUCTION - Development Release]"
license = "Apache-2.0"
repository = "https://github.com/rustnn/rustnn"
keywords = ["webnn", "onnx", "coreml", "tensorrt", "neural-networks"]
categories = ["science", "api-bindings"]
exclude = [
    "site/*",
    "docs/*",
    "tests/*",
    "examples/*",
    ".github/*",
    "*.md",
    "!README.md",
]

# The `objc` 0.2 `msg_send!`/`sel_impl!` macros expand to `cfg(feature = "cargo-clippy")`,
# which rustc flags as an unexpected cfg. A file-level `#![allow(unexpected_cfgs)]` does not
# suppress it because the diagnostic originates inside the external macro; declaring the value
# here (crate-wide check-cfg) is the reliable fix and keeps CI's `-D warnings` green.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))', 'cfg(web_sys_unstable_apis)'] }

[features]
default = []
dynamic-inputs = []
coreml-runtime = ["objc", "block"]
onnx-runtime = ["ort", "ndarray"]
trtx-runtime = ["trtx", "cudarc", "zstd-cache-compression"]
trtx-runtime-mock = ["trtx/mock", "cudarc"]
# test feature for validation of RTX runtime
trtx-enterprise = ["trtx-runtime", "trtx/enterprise"]
zstd-cache-compression = ["dep:zstd"]
litert-runtime = ["litert", "litert-sys", "dep:flatbuffers"]
cann-runtime = ["dep:hiai-rs"]
cann-runtime-mock = []
native-examples = []
webnn-wpt-tests = []
webnn-runtime = ["wasm-bindgen", "web-sys", "js-sys", "pollster", "wasm-bindgen-futures", "Ml", "MlArgMinMaxOptions", "MlBatchNormalizationOptions", "MlClampOptions", "MlContext", "MlContextOptions", "MlConv2dFilterOperandLayout", "MlConv2dOptions", "MlConvTranspose2dFilterOperandLayout", "MlConvTranspose2dOptions", "MlCumulativeSumOptions", "MlEluOptions", "MlGatherOptions", "MlGemmOptions", "MlGraph", "MlGraphBuilder", "MlGruCellOptions", "MlGruOptions", "MlGruWeightLayout", "MlHardSigmoidOptions", "MlInputOperandLayout", "MlInstanceNormalizationOptions", "MlInterpolationMode", "MlLayerNormalizationOptions", "MlLeakyReluOptions", "MlLinearOptions", "MlLstmCellOptions", "MlLstmOptions", "MlLstmWeightLayout", "MlOperand", "MlOperandDataType", "MlOperandDescriptor", "MlOperatorOptions", "MlPadOptions", "MlPaddingMode", "MlPool2dOptions", "MlPowerPreference", "MlRecurrentNetworkActivation", "MlRecurrentNetworkDirection", "MlReduceOptions", "MlResample2dOptions", "MlReverseOptions", "MlRoundingType", "MlScatterOptions", "MlSliceOptions", "MlSplitOptions", "MlTensor", "MlTensorDescriptor", "MlTransposeOptions", "MlTriangularOptions"]
pollster = ["dep:pollster"]

MimeTypeArray = []
GpuDevice = []
Ml = []
MlArgMinMaxOptions = []
MlBatchNormalizationOptions = []
MlBatchNormalizationSupportLimits = []
MlBinarySupportLimits = []
MlClampOptions = []
MlConcatSupportLimits = []
MlContext = []
MlContextLostInfo = []
MlContextOptions = []
MlConv2dFilterOperandLayout = []
MlConv2dOptions = []
MlConv2dSupportLimits = []
MlConvTranspose2dFilterOperandLayout = []
MlConvTranspose2dOptions = []
MlCumulativeSumOptions = []
MlEluOptions = []
MlGatherOptions = []
MlGatherSupportLimits = []
MlGemmOptions = []
MlGemmSupportLimits = []
MlGraph = []
MlGraphBuilder = []
MlGruCellOptions = []
MlGruCellSupportLimits = []
MlGruOptions = []
MlGruSupportLimits = []
MlGruWeightLayout = []
MlHardSigmoidOptions = []
MlInputOperandLayout = []
MlInstanceNormalizationOptions = []
MlInterpolationMode = []
MlLayerNormalizationOptions = []
MlLeakyReluOptions = []
MlLinearOptions = []
MlLogicalNotSupportLimits = []
MlLstmCellOptions = []
MlLstmCellSupportLimits = []
MlLstmOptions = []
MlLstmSupportLimits = []
MlLstmWeightLayout = []
MlNormalizationSupportLimits = []
MlOpSupportLimits = []
MlOperand = []
MlOperandDataType = []
MlOperandDescriptor = []
MlOperatorOptions = []
MlPadOptions = []
MlPaddingMode = []
MlPool2dOptions = []
MlPowerPreference = []
MlPreluSupportLimits = []
MlQuantizeDequantizeLinearSupportLimits = []
MlRankRange = []
